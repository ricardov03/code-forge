version: 1
project:
  name: code-forge
  slug: code-forge
provider: anthropic
levels:
  L0:
    model: claude-haiku-4-5-20251001
  L1:
    model: claude-sonnet-5
  L2:
    model: claude-opus-5-5
  L3:
    model: claude-fable-5-2
caps:
  coders: 2
review:
  multimodel: false
engine: auto
harnesses:
  - claude
system1:
  fallback: rules
gates:
  timeout_s: 3600
  test:
    - sh
    - test/helpers/run-suite.sh
    - "{test_files}"
  lint: null
  types:
    - npm
    - run
    - typecheck
  format: null
  # B427: hubs measured on the B362b+B402 batch (most tests reach a change
  # through them); their own tests still run when the closure reaches them.
  import_graph:
    stop:
      - src/session/spawn.mjs
      - src/config/validate.mjs
      - src/worker/loop.mjs
      - src/context/pack.mjs
      - src/cli/block.mjs
proof:
  tiers:
    high:
      paths: []
  isolation: export
  export:
    link_dirs:
      - node_modules
    copy_untracked: []
