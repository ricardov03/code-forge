version: 1
project:
  name: code-forge
  slug: code-forge
provider: anthropic
levels:
  L0:
    model: claude-haiku-4-5-20251001
  L1:
    model: claude-sonnet-5
  L2:
    model: claude-opus-5-5
  L3:
    model: claude-fable-5-2
caps:
  coders: 2
review:
  multimodel: false
engine: auto
harnesses:
  - claude
system1:
  fallback: rules
gates:
  timeout_s: 3600
  # B760: Go only. The test gate runs `go test` on the packages of the selected Go files
  # (native/cmd/cf-gotest; no file is every package); types is go vet.
  test:
    - go
    - -C
    - native
    - run
    - ./cmd/cf-gotest
    - "{test_files}"
  lint: null
  types:
    - go
    - -C
    - native
    - vet
    - ./...
  format: null
proof:
  tiers:
    high:
      paths: []
  isolation: export
  export:
    link_dirs:
      - node_modules
    copy_untracked: []
land:
  # B815: land re-generates the reference docs when they conflict (B795), instead of merging
  # them row by row; docs/native-engine.md keeps the default row-by-row table merge.
  auto_resolve:
    generated:
      - path: docs/reference/commands.md
        argv: [sh, scripts/gen-commands-doc.sh]
      - path: docs/reference/commands.json
        argv: [sh, scripts/gen-commands-doc.sh]
      - path: docs/reference/config.md
        argv: [sh, scripts/cf-release.sh, config-doc]
