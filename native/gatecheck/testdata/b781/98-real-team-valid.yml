# Team config: reviewed by platform team
version: 1
project:
  name: Mobile App
  slug: mobile-app
provider: anthropic
levels:
  L0:
    model: claude-haiku-4-5-20251001
  L1:
    model: claude-sonnet-5
    fallback:
      - provider: openai
        model: gpt-5.5
  L2:
    model: claude-opus-5-5
  L3:
    model: claude-fable-5-2
keys:
  jev: op://Dev/jev/credential
gates:
  test: ["sh", "-c", "exit 0", "{test_files}"]
  lint: null
  types: null
  format: null
review:
  close_wait_s: 3
  second_provider: openai
proof:
  tiers:
    high:
      paths: []
  runners:
    - match: ["**/*Tests.swift"]
      adapter: swift
      argv: ["swift", "test", "--filter", "{test_filter}", "--xunit-output", "{report}"]
