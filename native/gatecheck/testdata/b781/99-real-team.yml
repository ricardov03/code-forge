# Team config (real-world shape)
version: 1
project:
  name: Audit
  slug: audit
  plans_dir: plans
provider: anthropic
levels:
  L0:
    model: claude-haiku-4-5-20251001
  L1:
    model: claude-sonnet-5
    fallback:
      - provider: openai
        model: gpt-5.5
  L2:
    model: claude-opus-5-5
  L3:
    model: claude-fable-5-2
orchestrator: L1
engine: auto
harnesses:
  - claude
caps:
  coders: 4
system1:
  fallback: rules
escalation:
  stop_at: L3
review:
  close_wait_s: 3
  multimodel: false
  second_provider: xai
  second_levels:
    L2:
      provider: xai
      model: grok-4.7
  routes:
    - min_lines: 401
      level: L2
      provider: xai
      model: grok-4.7
  on_unavailable:
    - level: L2
      provider: openai
      model: gpt-5.5
gates:
  timeout_s: 600
  # tests for changed files
  test: ["sh", "-c", "exit 0", "x", "{test_files}"]
  lint: null
  types: null
  format: null
  custom:
    - name: docs
      argv: ["sh", "-c", "exit 0"]
proof:
  tiers:
    high:
      paths: []
  isolation: export
  runners:
    - match: ["**/*Tests.swift"]
      adapter: swift
      argv: ["swift", "test"]
keys:
  jev: op://Private/typesafe/credential
context:
  require_coder_tests: true
coder:
  sandbox:
    profile: toolchain
calibration:
  shadow_rate: 0
