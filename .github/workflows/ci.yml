name: CI

on:
  push:
    # ci-check-* lets a pre-release check run on a branch push before main moves (B239)
    branches: [main, 'ci-check-*']
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  # B690b: the product is the Go binary; Node is gone from it. This job checks what npm ships and the
  # generated docs. npm itself needs Node, so setup-node stays here only to run npm and the pack
  # check (B760: the config doc generator is Go, `sh scripts/cf-release.sh config-doc`).
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      # npm ci fails outright if npm-shrinkwrap.json and package.json disagree: the shrinkwrap check.
      - name: Install (shrinkwrap-checked)
        run: npm ci

      - name: npm pack --dry-run ships no src/, no Node entry and no maintainer .mjs
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const files = JSON.parse(require("fs").readFileSync("pack.json", "utf8"))[0].files.map((f) => f.path);
            const bad = files.filter((p) => p.startsWith("src/") || p === "bin/code-forge.mjs" || /^scripts\/.*\.mjs$/.test(p) || p.startsWith("test/"));
            if (!files.includes("bin/code-forge") || !files.includes("scripts/install.sh")) { console.error("pack misses bin/code-forge or scripts/install.sh"); process.exit(1); }
            if (bad.length) { console.error("pack ships Node files:\n" + bad.join("\n")); process.exit(1); }
            console.log(files.length + " files, no src/, no Node entry");'

      - name: npm audit (high severity)
        run: npm audit --audit-level=high

      - name: config-doc --check
        run: sh scripts/cf-release.sh config-doc --check

      - name: gen-commands-doc --check
        run: sh scripts/gen-commands-doc.sh --check

  # B237: the Go core (native/) has its own tests, on the go.mod floor and on the newest Go.
  # B777: split for wall clock, same coverage. cmd/code-forge-native (~11 min under -race in one
  # process) runs in shards (scripts/ci-shards.sh: sorted `go test -list`, round-robin, so a new test
  # lands in a shard with no hand list); every other package runs in go-other. Go stable runs every
  # test under -race; Go 1.22.x (the floor) runs the same tests without -race. gofmt, vet, the shard
  # coverage guard and the four release builds run once, on stable, beside the tests.
  # Go cache: setup-go's key is the OS, Go version and native/go.sum (no commit), and the first job
  # to finish saves it. Only the test jobs use it, so the stable cache holds -race builds (std and
  # deps); go-lint, build-native and package keep cache: false so they cannot save a cache with no
  # -race builds under that key first.
  # The shard count is NATIVE_SHARDS: the shard matrices must list 1..NATIVE_SHARDS (each shard job
  # checks strategy.job-total against it, and go-lint proves the union of NATIVE_SHARDS shards).
  go-lint:
    name: go lint (stable)
    runs-on: ubuntu-latest
    env:
      NATIVE_SHARDS: 6
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: gofmt (no unformatted files)
        run: test -z "$(find . -path ./vendor -prune -o -name '*.go' -print | xargs gofmt -l)" || { find . -path ./vendor -prune -o -name '*.go' -print | xargs gofmt -l; exit 1; }

      - name: go vet
        run: go vet ./...

      # Each shard's -run regex selects exactly its tests, no test is in two shards, and the union
      # is the full `go test -list` of cmd/code-forge-native.
      - name: shard coverage guard
        run: sh ../scripts/ci-shards.sh check "$NATIVE_SHARDS"

  # All four release targets must build, and the host binary must run (B690b: plain go build,
  # the same flags the release tool uses; no Node).
  build-native:
    name: build-native (stable)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: build-native (all release targets)
        run: |
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build -trimpath -ldflags "-s -w" -o "bin-ci/${t%/*}-${t#*/}/code-forge-native" ./cmd/code-forge-native
          done
          bin-ci/linux-amd64/code-forge-native version

  # cmd/code-forge-native in shards. GOFLAGS carries -race (stable) so the -list build and the test
  # run share one compile.
  go-native:
    name: go native (${{ matrix.go }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: [stable, '1.22.x']
        shard: [1, 2, 3, 4, 5, 6]
    env:
      NATIVE_SHARDS: 6
      GOFLAGS: ${{ matrix.go == 'stable' && '-race' || '' }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: native/go.sum

      - name: go test (shard ${{ matrix.shard }} of cmd/code-forge-native)
        env:
          SHARD: ${{ matrix.shard }}
          JOBS: ${{ strategy.job-total }}
        run: |
          [ "$JOBS" -eq $((2 * NATIVE_SHARDS)) ] || { echo "the go-native matrix has $JOBS jobs, NATIVE_SHARDS=$NATIVE_SHARDS needs $((2 * NATIVE_SHARDS)) (2 Go versions)"; exit 1; }
          re=$(sh ../scripts/ci-shards.sh regex $((SHARD - 1)) "$NATIVE_SHARDS")
          echo "GOFLAGS='$GOFLAGS', shard $SHARD of $NATIVE_SHARDS: $(printf '%s\n' "$re" | tr '|' '\n' | wc -l | tr -d ' ') tests"
          go test -count=1 -timeout 30m -run "$re" ./cmd/code-forge-native

  # Every native package but cmd/code-forge-native.
  go-other:
    name: go other packages (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: [stable, '1.22.x']
    env:
      GOFLAGS: ${{ matrix.go == 'stable' && '-race' || '' }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: native/go.sum

      - name: go test (all packages but cmd/code-forge-native)
        run: |
          pkgs=$(go list ./... | grep -v '/cmd/code-forge-native$')
          [ -n "$pkgs" ] || { echo "no packages"; exit 1; }
          echo "GOFLAGS='$GOFLAGS', $(printf '%s\n' "$pkgs" | wc -l) packages"
          go test -count=1 -timeout 30m $pkgs
