name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # one Node version failing must not cancel the other: see every failure in one run
      fail-fast: false
      matrix:
        # Ruling R7 (2026-09-24): Node 22+ only.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # npm ci fails outright if npm-shrinkwrap.json and package.json disagree — this IS the
      # shrinkwrap check (plan §1.1/§8.5), no separate step needed.
      - name: Install (shrinkwrap-checked)
        run: npm ci

      # `npm test` = three `node --import ./test/helpers/isolate.mjs … --test` invocations:
      # test/no-leak.test.mjs with CODE_FORGE_NO_LEAK=snapshot (pre-suite snapshot of the real
      # dirs), then 'test/**/*.test.mjs' (--experimental-test-module-mocks), then
      # test/no-leak.test.mjs with CODE_FORGE_NO_LEAK=final (0 new entries under the real
      # ~/.code-forge or <repo>/.code-forge since the snapshot). The preload pins HOME, TMPDIR
      # and the cwd of every test worker to a per-process temp root and fails a worker that
      # writes into those real dirs (plan §9.6). No mutation-testing job (ruling R14).
      - name: Unit tests (node --test, isolated by the test/helpers/isolate.mjs preload)
        run: npm test

      - name: Typecheck (tsc --checkJs --noEmit)
        run: npm run typecheck

      - name: npm pack --dry-run (files whitelist sanity)
        run: npm pack --dry-run

      - name: npm audit (high severity)
        run: npm audit --audit-level=high

      # Skill / plugin validation (`claude plugin validate .`, plan §9.2) is deliberately NOT a
      # step here. `.claude-plugin/plugin.json` doesn't exist until B15, and the `claude` CLI
      # isn't installed on GitHub-hosted runners — a step that only checks `command -v claude`
      # and echoes a message when absent would go green forever without ever validating anything
      # once B15 does add the plugin manifest (review finding, B0 fix round 1). ci.yml is B0-owned
      # forever (§10.1) and cannot be edited later, so it doesn't promise a check it can't keep;
      # `claude plugin validate .` runs locally in step 4 of `npm run release`, before every
      # release (the release workflow only creates the GitHub release).

