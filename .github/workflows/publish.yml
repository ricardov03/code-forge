name: Publish

# Plan §10.5. Runs on a `v*` tag only (never on a push to main): plugin validation (its own job,
# no id-token), then the shrinkwrap check, the full unit-test suite, a read-only `npm pack
# --dry-run`, `npm publish --provenance` from GitHub's OIDC token, and a post-publish smoke test
# against the tarball that actually landed on the registry. B0's `.github/workflows/ci.yml` already covers every push/PR;
# nothing here duplicates that job, it only adds what a tag needs.
on:
  push:
    tags:
      - 'v*'

# Least privilege by default: no job gets an OIDC token unless it asks for one. Only `publish`
# does (below); `validate` installs a third-party CLI and never gets it.
permissions:
  contents: read

jobs:
  # `claude plugin validate` needs a real `claude` CLI, which GitHub-hosted runners don't ship
  # (see ci.yml's comment on why it can't run this on every push: no CLI, and B15 is the block
  # that first adds `.claude-plugin/plugin.json` to validate). `plugin validate` is a static
  # manifest/skill-structure check — it never calls a model and needs no login — so no
  # ANTHROPIC_API_KEY or `claude login` step is configured or needed. It runs in its OWN job,
  # with no `id-token` permission and no secrets, so the globally installed CLI never shares a
  # runner with the provenance token or NPM_TOKEN; `publish` waits for it (`needs: validate`).
  validate:
    name: validate (claude plugin validate, no id-token)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pinned to an exact version, with install scripts off. Bumping CLAUDE_CODE_VERSION is a
      # deliberate change (read that release's notes, then edit this line) — never `latest`.
      - name: Install the claude CLI (pinned; for `plugin validate` only — no login, no model calls)
        env:
          CLAUDE_CODE_VERSION: 2.1.282
        run: npm install -g --ignore-scripts "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      # With --ignore-scripts the package's postinstall never copies the native binary over the
      # `claude` bin, which stays an error stub; the package's own cli-wrapper.cjs resolves the
      # platform binary from its optional dependency and runs it (checked with 2.1.282).
      - name: Validate the plugin manifest and skill (claude plugin validate .)
        run: node "$(npm root -g)/@anthropic-ai/claude-code/cli-wrapper.cjs" plugin validate .

  publish:
    name: publish (npm, OIDC provenance)
    needs: validate
    runs-on: ubuntu-latest
    # Required for `npm publish --provenance`: npm exchanges this token for a short-lived Sigstore
    # signing identity and attaches the attestation to the published package (no long-lived signing
    # key lives in this repo or its secrets). This job never installs the claude CLI.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # npm ci fails outright if npm-shrinkwrap.json and package.json disagree — this IS the
      # shrinkwrap check (plan §1.1/§8.5), same reasoning as ci.yml.
      - name: Install (shrinkwrap-checked)
        run: npm ci

      - name: Unit tests (node --test, isolated by the test/helpers/isolate.mjs preload)
        run: npm test

      - name: Typecheck (tsc --checkJs --noEmit)
        run: npm run typecheck

      - name: npm pack --dry-run (read the exact file list before publishing)
        run: npm pack --dry-run

      - name: npm audit (high severity)
        run: npm audit --audit-level=high

      # The tag is the source of truth for what gets published: refuse a tag that does not name
      # the exact version package.json carries (a stale tag, or a version bump that forgot to
      # re-tag), before anything is published under it.
      - name: The tag must match package.json's version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version v${version}" >&2
            exit 1
          fi

      # `NPM_TOKEN` (an npm "Automation" token, repo secret) authenticates the publish itself;
      # `--provenance` uses this job's OIDC id-token (above) to attach the attestation. Ricardo
      # creates `NPM_TOKEN` once, outside this repo (npmjs.com → Access Tokens).
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Post-publish smoke (plan §10.5): the tarball that actually landed on the registry, not the
      # working tree, answers `doctor --json` with valid JSON.
      #  - Poll `npm view` (a metadata read, not an install) until the just-published version is
      #    visible, instead of retrying the install/run step itself.
      #  - Run `npx` exactly once after that, from an empty directory ($RUNNER_TEMP, never this
      #    checkout, so npx can't resolve a local/workspace copy) with `--prefer-online` (a fresh
      #    registry read, not a stale npx cache).
      #  - Keep npx's own stderr (progress/warnings) out of the captured JSON text; print it only
      #    if the step fails, for debugging.
      #  - Judge stdout as JSON regardless of `doctor`'s own exit code: a WARN/FAIL row (`ok:
      #    false`) is real doctor output and a legitimate result for this smoke test, which only
      #    checks that the published package runs and answers the documented shape — it is not a
      #    green-doctor gate.
      - name: Post-publish smoke — npx <published version> doctor --json
        run: |
          version="$(node -p "require('./package.json').version")"
          pkg="@codedology/code-forge@${version}"
          resolved=false
          for attempt in $(seq 1 20); do
            # `npm view` exits 0 with EMPTY output for a version that does not exist yet, so the
            # exit code proves nothing: compare what it prints with the version we published.
            seen="$(npm view "${pkg}" version --prefer-online 2>/dev/null || true)"
            if [ "${seen}" = "${version}" ]; then
              resolved=true
              break
            fi
            echo "attempt ${attempt}: ${pkg} not visible on the registry yet — retrying in 15s"
            sleep 15
          done
          if [ "${resolved}" != "true" ]; then
            echo "post-publish smoke failed: ${pkg} never became visible on the registry" >&2
            exit 1
          fi

          smoke_dir="$(mktemp -d "${RUNNER_TEMP}/code-forge-smoke-XXXXXX")"
          cd "${smoke_dir}"
          set +e
          npx --yes --prefer-online "${pkg}" doctor --json >stdout.log 2>stderr.log
          set -e
          node -e "
            const fs = require('node:fs');
            const data = fs.readFileSync('stdout.log', 'utf8');
            const parsed = JSON.parse(data);
            if (typeof parsed.ok !== 'boolean' || !Array.isArray(parsed.rows)) throw new Error('doctor --json did not print the {ok, counts, rows} shape');
            console.log(\`doctor --json: \${parsed.rows.length} row(s) from the published \${process.argv[1]} (ok: \${parsed.ok})\`);
          " "${pkg}" || {
            echo "post-publish smoke failed: doctor --json's stdout was not the expected shape; its stderr was:" >&2
            cat stderr.log >&2
            exit 1
          }

  # The GitHub release for the tag, created only after `publish` (npm publish + the post-publish
  # smoke) succeeded. Its body is the tag's CHANGELOG.md section plus the npm and changelog links
  # (`node scripts/release.mjs notes`, which needs only node:*, so no `npm ci`). It gets
  # `contents: write` and nothing else: no id-token, no NPM_TOKEN. Re-running it is safe: an
  # existing release is edited with the same notes instead of failing.
  github-release:
    name: github release (notes from CHANGELOG.md)
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Release notes from CHANGELOG.md
        run: node scripts/release.mjs notes "$GITHUB_REF_NAME" --out notes.md

      - name: Create the GitHub release (or update it when it already exists)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json tagName; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi
